name: ci

on:
  push:
  pull_request:

jobs:
  application-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m compileall -q src data_tools
      - run: python -m pcbparse.cli healthcheck
      - run: python -m pcbparse.submission_agent --help
      - run: python -m pcbparse.training.preflight_cli --help
